[workspace]
resolver = "2"
members = ["crates/veil-rules", "crates/veil-crypto", "crates/veil-verify", "crates/veil-wasm", "engine"]
# Built separately: the contract (wasm32-unknown-unknown via cargo-near) and the
# OutLayer engine binary (wasm32-wasip2, `engine --features outlayer`).
exclude = ["contracts/veil"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rand_core = "0.6"
rand_chacha = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
